<style>
@font-face {
  font-family: 'JetBrains Mono';
  src: url('/fonts/webfonts/JetBrainsMono-Regular.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'JetBrains Mono';
  src: url('/fonts/webfonts/JetBrainsMono-Medium.woff2') format('woff2');
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}

:root {
  color-scheme: light dark;
  --bg:        light-dark(#fcfbf7, #15141a);
  --bg-raised: light-dark(#f4f3ee, #1d1c24);
  --ink:       light-dark(#1c1c1c, #e9e7e1);
  --ink-soft:  light-dark(#45474a, #a8a6b0);
  --line:      light-dark(#d9d8d1, #2e2d38);
  --accent:    light-dark(#5b4fae, #a89ae8);
  --visited:   light-dark(#3f3475, #cdbefd);
  --hot:       light-dark(#a85b07, #df8e1d);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"]  { color-scheme: dark; }

html { overflow-y: scroll; }
figure { text-align: center; }
a.title { display: flex; align-items: center; gap: 0.5em; }
a.title h1 { font-family: 'JetBrains Mono', monospace; font-weight: 500; }
.avatar { width: 3em; height: 3em; border-radius: 50%; }
p.byline, time { font-family: monospace; font-style: normal; }
.blog-tags { font-size: 0.85em; }
main h2 { margin-top: 2.5em; }

.title-row { display: flex; align-items: center; gap: 1em; }
.title-row a.title { flex: 1 1 auto; min-width: 0; }

.theme-toggle {
  display: none;
  flex: none;
  background: none;
  border: 0;
  padding: 6px;
  margin-left: auto;
  cursor: pointer;
  color: var(--ink-soft);
  line-height: 0;
}
.has-js .theme-toggle { display: block; }
.theme-toggle:hover { color: var(--hot); }
.theme-toggle svg { width: 20px; height: 20px; }
.theme-toggle .sun { display: none; }
.theme-toggle .moon { display: block; }
@media (prefers-color-scheme: dark) {
  .theme-toggle .sun { display: block; }
  .theme-toggle .moon { display: none; }
}
:root[data-theme="light"] .theme-toggle .sun { display: none; }
:root[data-theme="light"] .theme-toggle .moon { display: block; }
:root[data-theme="dark"] .theme-toggle .sun { display: block; }
:root[data-theme="dark"] .theme-toggle .moon { display: none; }

body, main { background-color: var(--bg); color: var(--ink); }
h1, h2, h3, h4, h5, h6, strong, b { color: var(--ink); }

a { color: var(--accent); }
a:hover { color: var(--hot); }
a:visited, ul.blog-posts li a:visited { color: var(--visited); }
a:visited:hover, ul.blog-posts li a:visited:hover { color: var(--hot); }

blockquote { border-left: 1px solid var(--line); color: var(--ink-soft); }
table, th, td { border-color: var(--line); }
figcaption > p, .helptext { color: var(--ink-soft); }
.errorlist { color: var(--hot); }
.skip-link { background-color: var(--bg); color: var(--ink); }

textarea, input { background-color: var(--bg-raised); color: var(--ink); }
.search-input {
  display: block; margin: 1em 0;
  background: var(--bg-raised); color: var(--ink);
  border: 1px solid var(--line);
}

code { color: var(--ink); background-color: var(--bg-raised); }
.highlight, .chroma, .bg { color: #e9e7e1; background-color: #1d1c24; }
.chroma code { color: inherit; background-color: transparent; }

figure img, .note-images img { max-width: 100%; height: auto; padding: 10px; background-color: white; }
@media screen and (max-width: 768px) { figure img, .note-images img { padding: 3px; } }
</style>
<script>document.documentElement.classList.add("has-js");try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
